name: CI

on:
  pull_request:

# Cancel superseded runs when a PR is updated.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # Needed to install @zettaai/* packages from GitHub Packages via .npmrc.
  packages: read

jobs:
  ci:
    name: Lint, typecheck, test & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: "@zettaai"
          cache-dependency-path: |
            package-lock.json
            examples/**/package-lock.json

      - name: Install dependencies
        # Skip post-install scripts here, as a malicious
        # script could steal NODE_AUTH_TOKEN.
        run: npm ci --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Lint
        run: npm run lint:check

      - name: Check formatting
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Install uv
        # The kvstore S3 + icechunk suites spawn `uv ... run moto_server` (a
        # mock S3) and the vitest workspace setup runs `uv sync`. uv is not
        # preinstalled on the runner; the action also adds it to PATH.
        uses: astral-sh/setup-uv@v5

      - name: Install Playwright browser
        # `npm ci --ignore-scripts` skips the browser download that
        # @playwright/browser-chromium normally does on postinstall, so the
        # vitest browser project (chromium, *.browser_test.ts) has no binary to
        # launch. Fetch chromium (+ its headless shell) and the OS libraries it
        # needs on the runner.
        run: npx playwright install --with-deps chromium

      - name: Test
        run: npm test

      - name: Build client bundles
        run: >-
          npm run build --
          --no-typecheck
          --no-lint
          --define STATE_SERVERS=$(cat config/state_servers.json | tr -d " \t\n\r")
          --define CUSTOM_BINDINGS=$(cat config/custom-keybinds.json | tr -d " \t\n\r")
